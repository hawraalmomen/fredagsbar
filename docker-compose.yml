services:
  api:
    build:
      context: ./fredagsbar
      dockerfile: Dockerfile.api
    ports:
      - "5001:5000"

  frontend:
    build:
      context: ./fredagsbar
      dockerfile: Dockerfile.frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:5000
    depends_on:
      - api